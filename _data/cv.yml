research:
  - title: Research Assistant
    institution: Purdue University
    dates: 2024–Present
    contributions:
      - topic: Knowledge distillation (ongoing)
        description: Study on-policy knowledge distillation for LLMs, using teacher predictions to train the student on responses it generates.
      - topic: Average-reward distributional reinforcement learning
        description: Developed a quotient-categorical representation for bias distributions. Proved nonexpansiveness of the projected Bellman operator in a Cramér metric, established fixed-point existence, and proved convergence guarantees for sampled temporal-difference updates.
      - topic: Control under coupled dynamics
        description: Analyzed when distributional Bellman updates converge in Wasserstein distance to the optimal joint return law. Derived sample-based targets for estimating the first two joint return moments with neural networks.
      - topic: Adaptive LLM inference
        description: Designed a two-pass decoding policy for Qwen2.5-Math-7B that matched the 64-particle baseline’s mean MATH500 accuracy of 76.6% with 27.5% fewer particles across three seeds at the same escalation rate. Estimated sequence-level Rényi entropy from existing sequential Monte Carlo weights without extra model calls.

  - title: Research Assistant
    institution: Sharif University of Technology
    dates: 2022–2023
    description: Studied computer vision and multimodal learning in the AICD Lab.

